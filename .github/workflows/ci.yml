name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Format / Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  # Later steps execute repository-controlled scripts and do
                  # not require authenticated Git operations.
                  persist-credentials: false

            # Installs pnpm (pinned via packageManager/devEngines.packageManager)
            # and the pinned Node runtime (devEngines.runtime), then runs
            # pnpm install (frozen lockfile is pnpm's default under CI).
            - uses: pnpm/setup@v2
              with:
                  cache: true

            - name: Check formatting
              run: pnpm run fmt:check

            # oxlint runs type-aware with typeCheck: true (.oxlintrc.json) —
            # it subsumes tsc --noEmit; there is no separate typecheck step.
            - name: Lint
              run: pnpm run lint

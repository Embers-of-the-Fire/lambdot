name: Release

# release-plz-style flow, driven by conventional commits:
#   1. On every push to main, release-please opens (or refreshes) a single
#      release PR that bumps all publishable packages in lockstep and updates
#      their CHANGELOG.md files. See release-please-config.json.
#   2. Merging that PR makes release-please cut one git tag + GitHub release
#      per package and flips `releases_created`, which triggers the publish
#      job below.

on:
    push:
        branches: [main]

permissions:
    contents: write
    pull-requests: write

# Never cancel a run mid-publish when another commit lands on main.
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release-please:
        name: Release PR / GitHub releases
        runs-on: ubuntu-latest
        outputs:
            releases_created: ${{ steps.release.outputs.releases_created }}
        steps:
            - uses: googleapis/release-please-action@v4
              id: release

    publish:
        name: Publish to npm
        needs: release-please
        if: needs.release-please.outputs.releases_created == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # OIDC token for npm Trusted Publishing: nub exchanges it with
            # the registry for a short-lived package-scoped publish token,
            # so no long-lived npm token is needed. npm also generates the
            # provenance attestation automatically on this path.
            id-token: write
        steps:
            - uses: actions/checkout@v7

            - uses: nubjs/setup-nub@v0
              with:
                  cache-dependency-path: nub.lock

            - name: Publish workspace packages
              run: nub publish -r --filter '@lambdot/*' --access public --no-git-checks --provenance

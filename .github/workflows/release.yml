name: Release

# release-plz-style flow, driven by conventional commits:
#   1. On every push to main, release-please opens (or refreshes) a single
#      release PR that bumps all publishable packages in lockstep and updates
#      their CHANGELOG.md files. See release-please-config.json.
#   2. Merging that PR makes release-please cut one git tag + GitHub release
#      per package and flips `releases_created`, which triggers the publish
#      job below.

on:
    push:
        branches: [main]

permissions:
    contents: write
    pull-requests: write

# Never cancel a run mid-publish when another commit lands on main.
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release-please:
        name: Release PR / GitHub releases
        runs-on: ubuntu-latest
        outputs:
            releases_created: ${{ steps.release.outputs.releases_created }}
        steps:
            - uses: googleapis/release-please-action@v4
              id: release

    publish:
        name: Publish to npm
        needs: release-please
        if: needs.release-please.outputs.releases_created == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write # OIDC, required by `nub publish --provenance`
        steps:
            - uses: actions/checkout@v7

            - uses: nubjs/setup-nub@v0
              with:
                  cache-dependency-path: nub.lock

            # Packages depend on each other via `workspace:*`, which must
            # never reach the registry; resolve it to real versions on this
            # throwaway checkout before publishing.
            - name: Resolve workspace protocol ranges
              run: nub scripts/rewrite-workspace-deps.ts

            - name: Publish workspace packages
              env:
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > .npmrc
                  nub publish -r --filter '@lambdot/*' --access public --no-git-checks --provenance

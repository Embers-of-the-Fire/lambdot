name: Release

# Changesets flow (changesets.dev/guide/automating, trusted-publishing
# variant), driven by committed .changeset/*.md files:
#   1. On every push to main, select-mode inspects the repo state: pending
#      changesets -> "version" (open/refresh the "Version Packages" PR);
#      publishable but not-yet-published packages -> "publish".
#   2. The version job bumps package manifests, regenerates CHANGELOG.md
#      files (changelog-github) and refreshes pnpm-lock.yaml in the same
#      commit (`changeset version` + `pnpm install --lockfile-only
#      --no-frozen-lockfile` — pnpm defaults to frozen lockfile in CI, so the
#      override is required). Manifest pins and lockfile therefore cannot
#      drift.
#   3. Merging the version PR makes select-mode return "publish": the pack
#      job builds tarballs from the publish plan (no build step — packages
#      ship raw TypeScript source), and the publish job pushes them to npm.
#      Publishing goes through `changeset publish`, which spawns pnpm's
#      native publish: per-package OIDC trusted publishing with automatic
#      provenance attestation. No long-lived npm token exists; id-token:
#      write is scoped to the publish job only.

on:
    push:
        branches: [main]
    workflow_dispatch:

# Reset permissions; each job declares exactly what it needs.
permissions: {}

# Never cancel a run mid-publish when another commit lands on main.
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    select-mode:
        name: Select mode
        runs-on: ubuntu-latest
        permissions:
            contents: read # actions/checkout
        outputs:
            mode: ${{ steps.select-mode.outputs.mode }}
            publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            # Installs pnpm (pinned via packageManager/devEngines.packageManager)
            # and the pinned Node runtime (devEngines.runtime), then runs
            # pnpm install.
            - uses: pnpm/setup@v2

            - id: select-mode
              uses: changesets/action/select-mode@v2

    version:
        name: Version packages (release PR)
        needs: select-mode
        if: needs.select-mode.outputs.mode == 'version'
        runs-on: ubuntu-latest
        permissions:
            contents: write # actions/checkout + commit version changes
            pull-requests: write # create/update the version PR
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: pnpm/setup@v2

            - uses: changesets/action/version@v2
              with:
                  # Bump manifests and changelogs, then refresh the lockfile
                  # in the same commit — pnpm defaults to --frozen-lockfile
                  # in CI, which is precisely what must not apply here.
                  script: pnpm changeset version && pnpm install --lockfile-only --no-frozen-lockfile

    pack:
        name: Pack publishable packages
        needs: select-mode
        if: needs.select-mode.outputs.mode == 'publish'
        runs-on: ubuntu-latest
        permissions:
            contents: read # actions/checkout
        outputs:
            pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: pnpm/setup@v2

            - id: pack
              uses: changesets/action/pack@v2
              with:
                  publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

    publish:
        name: Publish to npm
        needs: pack
        runs-on: ubuntu-latest
        permissions:
            contents: write # actions/checkout + create GitHub releases
            # OIDC token for npm Trusted Publishing: pnpm exchanges it with
            # the registry for a short-lived package-scoped publish token,
            # so no long-lived npm token is needed. npm also generates the
            # provenance attestation automatically on this path.
            id-token: write
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: pnpm/setup@v2

            - uses: changesets/action/publish@v2
              with:
                  pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
                  create-github-releases: true
